[package]
name = "tapo-power-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "TPAP client and HTTP power-control server for Tapo power strips"

[dependencies]
aes = "0.9"
axum = "0.8.9"
base64 = "0.23.1"
ccm = "0.6"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
md-5 = "0.11"
p256 = "0.14"
pbkdf2 = "0.13"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
zeroize = "1.9.1"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
